<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dhikr</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      /* Transparent full-monitor overlay: only the dhikr card paints, so the
         window reads as a floating balloon (the Rust window is transparent +
         click-through and covers the screen). */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- Transparent, click-through, full-monitor dhikr overlay. Reuses the shared
         overlay-tasbih.js, which anchors the card to the corner from Settings
         (position). The phrase is picked here (i18n + tasbih-phrases) so the
         shared popup needn't load the phrase bank. Rust stores the config; we
         pull it via get_dhikr_config (and also listen for "activate-dhikr"). -->
    <script src="i18n.js"></script>
    <script src="tasbih-phrases.js"></script>
    <script src="overlay-tasbih.js"></script>
    <script>
      (function () {
        const TAURI = globalThis.__TAURI__ || {};
        const listen = TAURI.event && TAURI.event.listen;
        const invoke = TAURI.core && TAURI.core.invoke;

        function activate(cfg) {
          cfg = cfg || {};
          const lang = cfg.lang || "en";
          const L = tr(lang);
          const payload = {
            type: "ACTIVATE_TASBIH",
            display: randomTasbihPhrase(lang),
            label: L.tasbihCardLabel,
            dir: L.dir,
            lang,
            theme: normalizeTheme(cfg.theme),
            position: cfg.position || "bottom-center",
          };
          if (window.__prayerTasbihActivate) window.__prayerTasbihActivate(payload);
        }

        if (listen) listen("activate-dhikr", (e) => activate(e.payload));
        // In case the event fired before this listener attached, ask Rust for it.
        if (invoke) invoke("get_dhikr_config").then((c) => c && activate(c)).catch(() => {});
      })();
    </script>
  </body>
</html>
