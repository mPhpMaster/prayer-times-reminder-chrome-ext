# GitHub Pages: docs/ (privacy, terms, delete-account, READMEs — built by
# Jekyll exactly as the old "deploy from /docs" setting did) plus the website
# under /app/ (`node tools/sync-core.mjs web`, from core/ + targets/web/).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "targets/web/**"
      - "docs/**"
      - "tools/sync-core.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Build docs (Jekyll)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Build the website
        run: |
          node tools/sync-core.mjs web
          sudo mkdir -p _site/app
          sudo cp -r targets/web/build/. _site/app/
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}app/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
