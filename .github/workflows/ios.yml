# iOS app (targets/mobile/ios, Capacitor 8 + Swift Package Manager).
#
# Free: GitHub-hosted macOS runners cost nothing on a public repo, and nothing
# here is signed, so no Apple Developer account is needed. Produces:
#   ios-simulator-app  PrayerTimes-<ver>-simulator.zip   (App.app for the iOS Simulator)
#   ios-unsigned-ipa   PrayerTimes-<ver>-unsigned.ipa    (Payload/App.app, sideload
#                      with Sideloadly/AltStore + a free Apple ID — see targets/mobile/IOS.md)
#
# The "appstore" job is the signed App Store / TestFlight build for later. It
# never runs until the repo variable IOS_APPSTORE_ENABLED is "true" AND it is
# started by hand with appstore=true (secrets listed in IOS.md).
name: iOS

on:
  workflow_dispatch:
    inputs:
      appstore:
        description: "Also build a signed App Store archive (needs the Apple secrets; see IOS.md)"
        type: boolean
        default: false
  push:
    paths:
      - "targets/mobile/**"
      - "!targets/mobile/android/**"
      - "targets/mobile/android/app/build.gradle" # version source
      - "core/**"
      - "tools/sync-core.mjs"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned builds (simulator + device IPA)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: targets/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: targets/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Version (from the Android build, so both stores match)
        id: ver
        run: |
          gradle=android/app/build.gradle
          name=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' "$gradle" | head -1)
          code=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' "$gradle" | head -1)
          test -n "$name" && test -n "$code"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $name ($code)"

      - name: Assemble web layer + cap sync ios
        run: |
          node ../../tools/sync-core.mjs mobile
          npx cap sync ios
          test -f ios/App/App/public/audio/adhan.m4a

      - name: Xcode
        run: xcodebuild -version

      - name: Build for the iOS Simulator
        working-directory: targets/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" -quiet \
            MARKETING_VERSION=${{ steps.ver.outputs.name }} \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.code }} \
            CODE_SIGNING_ALLOWED=NO \
            build
          app="$RUNNER_TEMP/dd-sim/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "$RUNNER_TEMP/out/PrayerTimes-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-simulator.zip"

      - name: Build for devices (unsigned) + package the IPA
        working-directory: targets/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-dev" -quiet \
            MARKETING_VERSION=${{ steps.ver.outputs.name }} \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.code }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          app="$RUNNER_TEMP/dd-dev/Build/Products/Release-iphoneos/App.app"
          test -d "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' \
            -c 'Print :CFBundleVersion' "$app/Info.plist"
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$app/ar.lproj/InfoPlist.strings"
          pkg="$RUNNER_TEMP/ipa"
          rm -rf "$pkg" && mkdir -p "$pkg/Payload"
          cp -R "$app" "$pkg/Payload/"
          (cd "$pkg" && zip -qry "$RUNNER_TEMP/out/PrayerTimes-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-unsigned.ipa" Payload)
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/out/*-simulator.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/out/*-unsigned.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Signed App Store build — scaffold for when the Apple Developer account
  # exists. Disabled by default (see the `if:`). Secrets (Settings > Secrets
  # and variables > Actions), all described in targets/mobile/IOS.md:
  #   APPLE_TEAM_ID              10-character Team ID
  #   ASC_KEY_ID                 App Store Connect API key ID
  #   ASC_ISSUER_ID              App Store Connect API issuer ID
  #   ASC_KEY_P8_BASE64          the AuthKey_<id>.p8 file, base64
  #   IOS_DIST_CERT_P12_BASE64   (optional) Apple Distribution certificate .p12, base64
  #   IOS_DIST_CERT_PASSWORD     (optional) its password
  # Without the optional certificate, Xcode's cloud signing creates one through
  # the API key (the key needs the Admin role for that).
  # ---------------------------------------------------------------------------
  appstore:
    name: Signed App Store build (disabled until the Apple account exists)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.appstore && vars.IOS_APPSTORE_ENABLED == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: targets/mobile
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: targets/mobile/package-lock.json
      - run: npm ci
      - name: Version
        id: ver
        run: |
          gradle=android/app/build.gradle
          echo "name=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' "$gradle" | head -1)" >> "$GITHUB_OUTPUT"
          echo "code=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' "$gradle" | head -1)" >> "$GITHUB_OUTPUT"
      - run: |
          node ../../tools/sync-core.mjs mobile
          npx cap sync ios

      - name: App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      - name: Distribution certificate (optional)
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then echo "No certificate secret: using cloud signing."; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

      - name: Archive (automatic signing)
        working-directory: targets/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -quiet \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=${{ steps.ver.outputs.name }} \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.code }} \
            archive

      - name: Export + upload to App Store Connect (TestFlight)
        working-directory: targets/mobile/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/dist.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
